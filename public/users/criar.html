<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Usuário — CineApp</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav>
    <a href="/filmes/index.html" class="logo">CineApp</a>
    <a href="/filmes/index.html">Filmes</a>
    <a href="/users/index.html" class="ativo">Usuários</a>
  </nav>

  <main>
    <div class="page-header">
      <h1>Novo Usuário</h1>
      <a href="/users/index.html" class="btn btn-outline">← Voltar</a>
    </div>

    <div class="form-card">
      <form id="form">
        <div class="form-group">
          <label for="nome">Nome</label>
          <input type="text" id="nome" placeholder="Ex: João Silva" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Ex: joao@email.com" required>
        </div>

        <div class="form-group">
          <label for="senha">Senha <span class="opcional">(mín. 6 caracteres com 1 número)</span></label>
          <input type="password" id="senha" placeholder="Digite sua senha" required>
        </div>

        <div class="form-group">
          <label for="confirmacaoSenha">Confirmar Senha</label>
          <input type="password" id="confirmacaoSenha" placeholder="Repita a senha" required>
        </div>

        <div class="form-acoes">
          <button type="submit" class="btn btn-primario">Cadastrar</button>
          <a href="/users/index.html" class="btn btn-outline">Cancelar</a>
        </div>

        <div id="msg" class="msg"></div>
      </form>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      ocultarMensagem('msg');

      const dados = {
        nome: document.getElementById('nome').value,
        email: document.getElementById('email').value,
        senha: document.getElementById('senha').value,
        confirmacaoSenha: document.getElementById('confirmacaoSenha').value,
      };

      try {
        await usuariosApi.criar(dados);
        mostrarMensagem('msg', 'Usuário cadastrado com sucesso!', 'sucesso');
        e.target.reset();

        setTimeout(() => {
          window.location.href = '/users/index.html';
        }, 1200);

      } catch (erro) {
        mostrarMensagem('msg', erro.message, 'erro');
      }
    });
  </script>
</body>
</html>
